name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create GitHub releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git log between tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Show artifacts
        run: ls -lh dist/

      - name: Generate release notes from git log
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Find the previous tag (skip the one we just pushed)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          {
            echo "body<<RELEASE_EOF"

            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..HEAD"
            else
              echo "## Initial release"
              echo ""
              git log --no-merges --pretty=format:"- %s" HEAD
            fi

            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true

      # ── Optional: publish to PyPI ─────────────────────────────────────────
      # Uncomment and add PYPI_API_TOKEN to your repo secrets to enable.
      #
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
